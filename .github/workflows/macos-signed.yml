name: macOS signed candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            machine: arm64
          - runner: macos-15-intel
            arch: x64
            machine: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Check runner architecture
        run: test "$(uname -m)" = '${{ matrix.machine }}'
      - run: npm ci
      - run: npm run verify
      - name: Sign and notarize DMG and ZIP
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          for key in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_P8_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error title=Missing macOS signing input::$key is not configured"
              exit 1
            fi
          done
          key_dir="$(mktemp -d "$RUNNER_TEMP/pua-notary.XXXXXX")"
          key_path="$key_dir/AuthKey.p8"
          trap 'rm -f "$key_path"; rmdir "$key_dir"' EXIT
          node - "$key_path" <<'NODE'
          const fs = require('node:fs');
          const key = Buffer.from(process.env.APPLE_API_KEY_P8_BASE64, 'base64');
          if (!key.toString('utf8').includes('-----BEGIN PRIVATE KEY-----')) {
            throw new Error('APPLE_API_KEY_P8_BASE64 is not a valid App Store Connect .p8 key');
          }
          fs.writeFileSync(process.argv[2], key, { mode: 0o600 });
          NODE
          export APPLE_API_KEY="$key_path"
          npx electron-builder --config build/macos-release.mjs --mac --publish never
      - name: Verify signed and notarized app
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=(release/mac*/"Pi Desktop.app")
          test "${#apps[@]}" -eq 1
          codesign --verify --deep --strict --verbose=2 "${apps[0]}"
          xcrun stapler validate "${apps[0]}"
          spctl --assess --verbose=4 --type exec "${apps[0]}"
          PI_DESKTOP_TEST_EXECUTABLE="$PWD/${apps[0]}/Contents/MacOS/Pi Desktop" node scripts/smoke-desktop.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: pua-macos-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
          retention-days: 14
