name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      FORMAT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:protected
      - run: npm run check:boundaries
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run typecheck:tests
      - name: Test
        shell: bash
        run: |
          set +e
          npm test -- --reporter=default --reporter=github-actions > vitest.log 2>&1
          status=$?
          cat vitest.log
          if [ "$status" -ne 0 ]; then
            node -e 'const s=require("node:fs").readFileSync("vitest.log","utf8").slice(-6000);console.log("::error title=Vitest output::"+s.replaceAll("%","%25").replaceAll("\r","%0D").replaceAll("\n","%0A"))'
          fi
          exit "$status"
      - run: npm run build
      - if: runner.os == 'macOS'
        run: node scripts/smoke-ipc.mjs
      - if: runner.os == 'macOS'
        run: node scripts/smoke-lifecycle.mjs
