name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      FORMAT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:protected
      - run: npm run check:boundaries
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run typecheck:tests
      - name: Test
        shell: bash
        run: |
          for shard in {1..8}; do
            echo "Vitest shard $shard/8 (maxWorkers=2)"
            set +e
            npm test -- --maxWorkers=2 --reporter=dot --testTimeout=15000 --shard="$shard/8" > "vitest-$shard.log" 2>&1
            status=$?
            cat "vitest-$shard.log"
            if [ "$status" -ne 0 ]; then
              node -e 'const shard=process.argv[1];const s=require("node:fs").readFileSync(`vitest-${shard}.log`,"utf8").replace(/\u001b\[[0-9;]*m/g,"");const lines=s.split(/\r?\n/);const failures=lines.filter(line=>/^\s*(?:FAIL|Failed Tests|Failed Suites|Test Files|Tests\s|Errors\s|Error:|AssertionError:|TimeoutError:)/.test(line));const detail=failures.length?failures.join("\n").slice(0,3000):lines.slice(-30).join("\n").slice(-3000);console.log(`::error title=Vitest shard ${shard}/8 failures::`+detail.replaceAll("%","%25").replaceAll("\r","%0D").replaceAll("\n","%0A"))' "$shard"
              exit "$status"
            fi
          done
      - run: npm run build
      - if: runner.os == 'macOS'
        run: node scripts/smoke-ipc.mjs
      - if: runner.os == 'macOS'
        run: node scripts/smoke-lifecycle.mjs
      - name: Package unsigned installers
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set +e
          npx electron-builder --publish never > package.log 2>&1
          status=$?
          cat package.log
          if [ "$status" -ne 0 ]; then
            node -e 'const s=require("node:fs").readFileSync("package.log","utf8").replace(/\u001b\[[0-9;]*m/g,"");const lines=s.split(/\r?\n/);const errors=lines.filter(line=>/error|failed|cannot|ENOENT|ERR_|⨯/i.test(line));const detail=(errors.length?errors.slice(-15):lines.slice(-25)).join("\n").slice(-3000);console.log("::error title=Packaging failure::"+detail.replaceAll("%","%25").replaceAll("\r","%0D").replaceAll("\n","%0A"))'
          fi
          exit "$status"
      - name: Smoke packaged macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          shopt -s nullglob
          apps=(release/mac*/"Pi Desktop.app"/Contents/MacOS/"Pi Desktop")
          test "${#apps[@]}" -eq 1
          PI_DESKTOP_TEST_EXECUTABLE="$PWD/${apps[0]}" node scripts/smoke-desktop.mjs
      - name: Smoke packaged macOS app with offline Pi
        if: runner.os == 'macOS'
        shell: bash
        run: |
          npm install -g --ignore-scripts @earendil-works/pi-coding-agent@0.85.1
          test "$(pi --version)" = '0.85.1'
          shopt -s nullglob
          apps=(release/mac*/"Pi Desktop.app"/Contents/MacOS/"Pi Desktop")
          test "${#apps[@]}" -eq 1
          PI_DESKTOP_TEST_EXECUTABLE="$PWD/${apps[0]}" node scripts/smoke-pi.mjs
      - name: Smoke packaged Linux app
        if: runner.os == 'Linux'
        shell: bash
        run: |
          test -x release/linux-unpacked/pi-desktop
          PI_DESKTOP_TEST_EXECUTABLE="$PWD/release/linux-unpacked/pi-desktop" xvfb-run -a node scripts/smoke-desktop.mjs
      - name: Smoke packaged Windows app
        if: runner.os == 'Windows'
        shell: bash
        run: |
          test -f 'release/win-unpacked/Pi Desktop.exe'
          executable="$(node -p 'require("node:path").resolve("release/win-unpacked/Pi Desktop.exe")')"
          set +e
          PI_DESKTOP_TEST_EXECUTABLE="$executable" node scripts/smoke-desktop.mjs > desktop-smoke.log 2>&1
          status=$?
          cat desktop-smoke.log
          if [ "$status" -ne 0 ]; then
            node -e 'const s=require("node:fs").readFileSync("desktop-smoke.log","utf8").replace(/\u001b\[[0-9;]*m/g,"");const detail=s.split(/\r?\n/).slice(-40).join("\n").slice(-3000);console.log("::error title=Windows desktop smoke failure::"+detail.replaceAll("%","%25").replaceAll("\r","%0D").replaceAll("\n","%0A"))'
          fi
          exit "$status"
