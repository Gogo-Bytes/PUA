name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      FORMAT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:protected
      - run: npm run check:boundaries
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run typecheck:tests
      - name: Test
        shell: bash
        run: |
          for shard in {1..8}; do
            echo "Vitest shard $shard/8"
            set +e
            npm test -- --maxWorkers=2 --reporter=dot --testTimeout=15000 --shard="$shard/8" > "vitest-$shard.log" 2>&1
            status=$?
            cat "vitest-$shard.log"
            if [ "$status" -ne 0 ]; then
              node -e 'const shard=process.argv[1];const s=require("node:fs").readFileSync(`vitest-${shard}.log`,"utf8").replace(/\u001b\[[0-9;]*m/g,"");const lines=s.split(/\r?\n/);const failures=lines.filter(line=>/^\s*(?:FAIL|Failed Tests|Failed Suites|Test Files|Tests\s|Errors\s|Error:|AssertionError:|TimeoutError:)/.test(line));const detail=failures.length?failures.join("\n").slice(0,3000):lines.slice(-30).join("\n").slice(-3000);console.log(`::error title=Vitest shard ${shard}/8 failures::`+detail.replaceAll("%","%25").replaceAll("\r","%0D").replaceAll("\n","%0A"))' "$shard"
              exit "$status"
            fi
          done
      - run: npm run build
      - if: runner.os == 'macOS'
        run: node scripts/smoke-ipc.mjs
      - if: runner.os == 'macOS'
        run: node scripts/smoke-lifecycle.mjs
      - name: Package unsigned installers
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --publish never
